<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>編輯預訂</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A44}a:hover{color:#000000}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 1500px; position: relative; display: flex; flex-direction: column; background: #F4F6F9; color: #1E2A44; font-family: 'Noto Sans TC', system-ui, sans-serif; overflow: hidden">
<header style="padding: 52px 20px 12px; display: flex; justify-content: space-between; align-items: center">
  <a href="Bookings.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 15px; text-decoration: none">取消</a>
  <h1 style="margin: 0; font-size: 17px; font-weight: 700">編輯預訂</h1>
  <button onClick="{{save}}" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: #1E2A44; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700">儲存</button>
</header>

<main style="flex: 1; padding: 8px 20px 32px; display: flex; flex-direction: column; gap: 22px">
  <sc-if value="{{hasMsg}}" hint-placeholder-val="{{false}}">
    <p role="status" style="{{msgStyle}}">{{msg}}</p>
  </sc-if>

  <fieldset style="border: 0; margin: 0; padding: 0">
    <legend style="font-size: 13px; color: #5B6578; padding: 0; margin-bottom: 8px">類型</legend>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="6">
        <button aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </fieldset>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">名稱
      <input type="text" value="{{f.name}}" onChange="{{setName}}" style="height: 48px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 12px; padding: 0 12px; font: inherit; font-size: 17px; font-weight: 700; color: #1E2A44; background: #FFFFFF">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">{{dateLabel}}
        <input type="date" value="{{f.date}}" onChange="{{setDate}}" class="num" style="height: 48px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 12px; padding: 0 8px; font-size: 15px; color: #1E2A44; background: #FFFFFF">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">{{timeLabel}}
        <input type="time" value="{{f.time}}" onChange="{{setTime}}" class="num" style="height: 48px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 12px; padding: 0 8px; font-size: 15px; color: #1E2A44; background: #FFFFFF">
      </label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">訂單編號
      <input type="text" value="{{f.orderNo}}" onChange="{{setOrder}}" placeholder="確認信上的訂單或訂位代號" class="num" style="height: 48px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 12px; padding: 0 12px; font-size: 15px; color: #1E2A44; background: #FFFFFF">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">費用
        <input type="text" value="{{f.price}}" onChange="{{setPrice}}" placeholder="例如 ¥48,000" class="num" style="height: 48px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 12px; padding: 0 12px; font-size: 15px; color: #1E2A44; background: #FFFFFF">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">免費取消期限
        <input type="date" value="{{f.deadline}}" onChange="{{setDeadline}}" class="num" style="height: 48px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 12px; padding: 0 8px; font-size: 15px; color: #1E2A44; background: #FFFFFF">
      </label>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px"><input type="checkbox" checked="{{f.remind}}" onChange="{{toggleRemind}}" style="width: 22px; height: 22px; accent-color: #1E2A44">取消期限前 2 天提醒我</label>
    <button style="height: 48px; border-radius: 12px; border: 1px dashed #B8C0CC; background: transparent; color: #1E2A44; font: inherit; font-size: 15px">＋ 附上確認信截圖</button>
  </div>

  <section aria-labelledby="alt-h" style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #DCE1E8; padding-top: 18px">
    <div>
      <h2 id="alt-h" style="margin: 0; font-size: 17px; font-weight: 700">備案</h2>
      <p style="margin: 4px 0 0; font-size: 13px; color: #5B6578">主方案不行時，照這個順序改用。</p>
    </div>
    <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{alts}}" as="a" hint-placeholder-count="2">
        <li style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: #FFFFFF">
          <span class="num" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #1E2A44; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{a.no}}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{a.name}}</span><span style="{{a.subStyle}}">{{a.sub}}</span></span>
          <button aria-label="上移" onClick="{{a.up}}" disabled="{{a.isFirst}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg></button>
          <button aria-label="刪除備案" onClick="{{a.remove}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #B83A32; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </li>
      </sc-for>
    </ol>
    <sc-if value="{{noAlts}}" hint-placeholder-val="{{false}}">
      <p style="margin: 0; padding: 16px; border: 1.5px dashed #B8C0CC; border-radius: 12px; font-size: 14px; color: #5B6578; text-align: center">還沒有備案。先存一個，主方案出狀況時可以直接換。</p>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: #E4E8EE">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B6578">新增備案
        <input type="text" value="{{newAlt}}" onChange="{{setNewAlt}}" placeholder="例如：Hotel C 四條" style="height: 44px; box-sizing: border-box; border: 1px solid #DCE1E8; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; color: #1E2A44; background: #FFFFFF">
      </label>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px">狀態<select value="{{newStatus}}" onChange="{{setNewStatus}}" style="height: 40px; border: 1px solid #DCE1E8; border-radius: 10px; padding: 0 8px; font: inherit; font-size: 14px; color: #1E2A44; background: #FFFFFF"><option value="none">還沒訂</option><option value="ordered">已訂購</option><option value="confirmed">訂單確認</option></select></label>
        <button onClick="{{addAlt}}" style="height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: #1E2A44; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">加入備案</button>
      </div>
    </div>
  </section>

  <button style="height: 48px; border-radius: 12px; border: 0; background: transparent; color: #B83A32; font: inherit; font-size: 15px; font-weight: 700">刪除這筆預訂</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const f = st.f || { type: 'hotel', name: '京都車站飯店', date: '2026-11-20', time: '15:00', orderNo: '[訂單編號]', price: '', deadline: '2026-11-15', remind: true };
const alts = st.alts || [{ name: 'Hotel B 烏丸', status: 'confirmed', deadline: '11/18' }, { name: '河原町民宿', status: 'none' }];
const STATUS = { none: '還沒訂，要用時需先訂', ordered: '已訂購，還沒收到確認信', confirmed: '訂單確認' };
const set = (p) => this.setState({ f: { ...f, ...p }, msg: '' });
const T = [['flight', '機票'], ['hotel', '住宿'], ['train', '車票'], ['ticket', '門票'], ['restaurant', '餐廳'], ['car', '租車']];
const LBL = { hotel: ['入住日', '入住時間'], flight: ['起飛日', '起飛時間'], restaurant: ['日期', '訂位時間'], car: ['取車日', '取車時間'] };
const lbl = LBL[f.type] || ['日期', '時間'];
const setAlts = (a) => this.setState({ alts: a, msg: '' });
return {
f, dateLabel: lbl[0], timeLabel: lbl[1],
types: T.map(([k, l]) => ({ label: l, pressed: String(f.type === k), pick: () => set({ type: k }),
style: 'height: 40px; padding: 0 14px; border-radius: 20px; font: inherit; font-size: 14px; ' + (f.type === k ? 'border: 0; background: #1E2A44; color: #FFFFFF; font-weight: 700' : 'border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44') })),
setName: (e) => set({ name: e.target.value }),
setDate: (e) => set({ date: e.target.value }),
setTime: (e) => set({ time: e.target.value }),
setOrder: (e) => set({ orderNo: e.target.value }),
setPrice: (e) => set({ price: e.target.value }),
setDeadline: (e) => set({ deadline: e.target.value }),
toggleRemind: () => set({ remind: !f.remind }),
alts: alts.map((a, i) => ({
no: i + 1, name: a.name,
sub: STATUS[a.status || 'none'] + (a.status !== 'none' && a.deadline ? '，' + a.deadline + ' 前可免費取消' : ''),
subStyle: 'font-size: 12px; ' + (a.status === 'confirmed' ? 'color: #1F7A5C' : (a.status === 'ordered' ? 'color: #8A5A00' : 'color: #5B6578')),
isFirst: i === 0,
up: () => { const n = alts.slice(); [n[i - 1], n[i]] = [n[i], n[i - 1]]; setAlts(n); },
remove: () => setAlts(alts.filter((_, k) => k !== i))
})),
noAlts: !alts.length,
newAlt: st.newAlt || '', newStatus: st.newStatus || 'none',
setNewAlt: (e) => this.setState({ newAlt: e.target.value }),
setNewStatus: (e) => this.setState({ newStatus: e.target.value }),
addAlt: () => { const n = (st.newAlt || '').trim().slice(0, 40); if (!n) return; this.setState({ alts: alts.concat([{ name: n, status: st.newStatus || 'none' }]), newAlt: '', newStatus: 'none' }); },
hasMsg: !!st.msg, msg: st.msg || '',
msgStyle: 'margin: 0; padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; ' + (st.msgOk ? 'background: #DDF1E8; color: #1F7A5C' : 'background: #F9E1DF; color: #B83A32'),
save: () => {
if (!f.name.trim()) return this.setState({ msg: '請填名稱。', msgOk: false });
if (!f.date) return this.setState({ msg: '請填' + lbl[0] + '。', msgOk: false });
if (f.deadline && f.deadline > f.date) return this.setState({ msg: '免費取消期限晚於' + lbl[0] + '，請再確認。', msgOk: false });
this.setState({ msg: '已儲存，' + alts.length + ' 個備案' + (f.remind && f.deadline ? '，取消期限前 2 天會提醒你' : ''), msgOk: true });
}
};
}
}
</script>
</body>
</html>
