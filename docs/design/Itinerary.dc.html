<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>行程時間軸</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A44}a:hover{color:#000000}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F6F9; color: #1E2A44; font-family: 'Noto Sans TC', system-ui, sans-serif; overflow: hidden; position: relative">
<main style="flex: 1; overflow: hidden; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">行程</h1>
    <div role="group" aria-label="檢視方式" style="display: flex; background: #E4E8EE; border-radius: 12px; padding: 3px">
      <a href="PlanList.dc.html" style="height: 38px; padding: 0 14px; border-radius: 10px; color: #5B6578; font-size: 14px; text-decoration: none; display: flex; align-items: center">清單</a>
      <button aria-pressed="true" style="height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: #FFFFFF; color: #1E2A44; font: inherit; font-size: 14px; font-weight: 700">時間軸</button>
    </div>
  </header>

  <div role="tablist" aria-label="選擇日期" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
    <button role="tab" aria-selected="false" style="height: 56px; border: 0; border-radius: 12px; background: #FFFFFF; color: #1E2A44; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span class="num" style="font-size: 18px; font-weight: 700">20</span><span style="font-size: 11px; color: #5B6578">週五</span></button>
    <button role="tab" aria-selected="true" style="height: 56px; border: 0; border-radius: 12px; background: #1E2A44; color: #FFFFFF; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span class="num" style="font-size: 18px; font-weight: 700; color: #F2C14E">21</span><span style="font-size: 11px">週六</span></button>
    <button role="tab" aria-selected="false" style="height: 56px; border: 0; border-radius: 12px; background: #FFFFFF; color: #1E2A44; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span class="num" style="font-size: 18px; font-weight: 700">22</span><span style="font-size: 11px; color: #5B6578">週日</span></button>
    <button role="tab" aria-selected="false" style="height: 56px; border: 0; border-radius: 12px; background: #FFFFFF; color: #1E2A44; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span class="num" style="font-size: 18px; font-weight: 700">23</span><span style="font-size: 11px; color: #5B6578">週一</span></button>
    <button role="tab" aria-selected="false" style="height: 56px; border: 1px dashed #B8C0CC; border-radius: 12px; background: transparent; color: #1E2A44; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span class="num" style="font-size: 18px; font-weight: 700">24</span><span style="font-size: 11px; color: #5B6578">還沒排</span></button>
  </div>

  <section aria-label="11/21 時間軸" style="position: relative; height: 510px">
    <ol aria-hidden="true" style="list-style: none; margin: 0; padding: 0; position: absolute; inset: 0">
      <li class="num" style="position: absolute; top: 0; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">07:00</li>
      <li class="num" style="position: absolute; top: 50px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">08:00</li>
      <li class="num" style="position: absolute; top: 100px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">09:00</li>
      <li class="num" style="position: absolute; top: 150px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">10:00</li>
      <li class="num" style="position: absolute; top: 200px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">11:00</li>
      <li class="num" style="position: absolute; top: 250px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">12:00</li>
      <li class="num" style="position: absolute; top: 300px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">13:00</li>
      <li class="num" style="position: absolute; top: 350px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">14:00</li>
      <li class="num" style="position: absolute; top: 400px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">15:00</li>
      <li class="num" style="position: absolute; top: 450px; left: 0; right: 0; height: 50px; border-top: 1px solid #DCE1E8; font-size: 11px; color: #5B6578; padding-top: 2px">16:00</li>
    </ol>

    <a href="Place.dc.html" style="position: absolute; top: 2px; left: 52px; right: 0; height: 121px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 10px 12px; text-decoration: none; color: #1E2A44; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 2px rgba(30,42,68,0.12)">
      <span class="num" style="font-size: 12px; color: #5B6578">07:00 – 09:30</span>
      <span style="font-size: 16px; font-weight: 700">清水寺</span>
      <span style="font-size: 12px; color: #5B6578">想看 2 項，筆記 1 則</span>
      <span aria-hidden="true" style="margin-top: auto; align-self: center; width: 32px; height: 4px; border-radius: 2px; background: #DCE1E8"></span>
    </a>

    <a href="Transit.dc.html" style="position: absolute; top: 127px; left: 52px; right: 0; height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 12px; font-size: 12px; color: #5B6578; text-decoration: none">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M10 22l2-7 3 3v4M8 12l3-4 3 3 3 1"></path></svg>
      <span>步行 <span class="num">12</span> 分鐘</span>
      <span style="margin-left: auto; font-weight: 700; color: #1E2A44; background: #EEF1F5; padding: 3px 8px; border-radius: 10px">3 條路線，看班次</span>
    </a>

    <div style="position: absolute; top: 177px; left: 52px; right: 0; height: 106px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 2px rgba(30,42,68,0.12)">
      <span class="num" style="font-size: 12px; color: #5B6578">10:30 – 12:40</span>
      <span style="font-size: 16px; font-weight: 700">二年坂・產寧坂</span>
    </div>

    <p role="alert" style="position: absolute; top: 284px; left: 52px; right: 0; margin: 0; height: 30px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 2px 0 10px; border-radius: 8px; background: #F9E1DF; color: #B83A32; font-size: 12px; font-weight: 700; z-index: 1">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
      <span style="flex: 1">交通要 25 分，只排了 20 分</span>
      <button style="height: 26px; padding: 0 8px; border-radius: 6px; border: 0; background: #B83A32; color: #FFFFFF; font: inherit; font-size: 11px; font-weight: 700">後面全部延後 5 分</button>
    </p>

    <div style="position: absolute; top: 316px; left: 52px; right: 0; height: 66px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; box-shadow: 0 1px 2px rgba(30,42,68,0.12)">
      <span style="display: flex; flex-direction: column; gap: 2px"><span class="num" style="font-size: 12px; color: #5B6578">13:00 – 14:00</span><span style="font-size: 16px; font-weight: 700">午餐　祇園割烹</span></span>
      <span style="align-self: flex-start; font-size: 11px; font-weight: 700; color: #1F7A5C; background: #DDF1E8; padding: 3px 8px; border-radius: 10px">訂單確認</span>
    </div>

    <a href="Bookings.dc.html" style="position: absolute; top: 402px; left: 52px; right: 0; height: 60px; box-sizing: border-box; background: #FFFFFF; border: 1.5px solid #E8B4AF; border-radius: 12px; padding: 8px 12px; text-decoration: none; color: #1E2A44; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column; gap: 2px"><span class="num" style="font-size: 12px; color: #5B6578">15:00 – 15:30</span><span style="font-size: 16px; font-weight: 700">嵐山小火車</span></span>
      <span style="font-size: 11px; font-weight: 700; color: #B83A32; background: #F9E1DF; padding: 3px 8px; border-radius: 10px">還沒訂・1 個備案</span>
    </a>
  </section>
</main>

<div style="position: absolute; left: 20px; right: 20px; bottom: 100px; display: flex; gap: 10px">
  <button style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44; font: inherit; font-size: 15px; font-weight: 500; box-shadow: 0 4px 12px rgba(30,42,68,0.12)">排入 <span class="num">3</span> 個還沒排的景點</button>
  <button aria-label="新增行程" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #1E2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(30,42,68,0.18)">
    <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
</div>

<nav aria-label="主選單" style="height: 84px; box-sizing: border-box; padding: 6px 8px 24px; background: #FFFFFF; border-top: 1px solid #DCE1E8; display: flex">
  <a href="Today.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>今日
  </a>
  <a href="PlanList.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1E2A44; font-size: 11px; font-weight: 700">
    <span style="width: 52px; height: 30px; border-radius: 15px; background: #F2C14E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>行程
  </a>
  <a href="Bookings.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M15 7v10" stroke-dasharray="2 2"></path></svg></span>預訂
  </a>
  <a href="Essentials.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg></span>必備
  </a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

}
</script>
</body>
</html>
