<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F6F9; color: #1E2A44; font-family: 'Noto Sans TC', system-ui, sans-serif; overflow: hidden">
<main style="flex: 1; overflow: hidden; padding: 52px 20px 12px; display: flex; flex-direction: column; gap: 10px">
  <header>
    <p style="margin: 0; font-size: 13px; color: #5B6578">第 2 天，共 5 天</p>

    </div>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column">

      <button style="height: 48px; box-sizing: border-box; border-radius: 12px; border: 1px solid #E8B4AF; background: #FFFFFF; color: #B83A32; font: inherit; font-size: 15px; font-weight: 700">改用備案</button>

  <section aria-labelledby="next-h" style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">

      <span class="num" style="font-size: 14px; color: #5B6578">10:30</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px"><h2 id="next-h" style="margin: 0; font-size: 18px; font-weight: 700">二年坂・產寧坂</h2><button style="height: 40px; flex-shrink: 0; padding: 0 14px; border-radius: 10px; border: 0; background: #1E2A44; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">導航到這裡</button></div>

  <section aria-labelledby="later-h">
    <h2 id="later-h" style="margin: 0 0 4px; font-size: 13px; font-weight: 500; color: #5B6578">稍後</h2>

      </li>
      <li style="border-bottom: 1px solid #DCE1E8">
        <a href="PlanB.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 48px; text-decoration: none; color: #1E2A44">
          <span class="num" style="width: 44px; font-size: 14px; color: #5B6578">15:00</span>
          <span style="flex: 1; font-size: 15px">嵐山小火車</span>
          <span style="font-size: 12px; font-weight: 700; color: #B83A32; background: #F9E1DF; padding: 4px 10px; border-radius: 12px">還沒訂・有 1 個備案</span>
        </a>
      </li>
    </ul>
