<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>切換備案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A44}a:hover{color:#000000}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #F4F6F9; color: #1E2A44; font-family: 'Noto Sans TC', system-ui, sans-serif; overflow: hidden">
  <main style="padding: 56px 20px; display: flex; flex-direction: column; gap: 14px">
    <header>
      <p style="margin: 0; font-size: 13px; color: #5B6578">第 2 天，共 5 天</p>
      <h1 class="num" style="margin: 4px 0 0; font-size: 28px; font-weight: 700">11/21 週六</h1>
    </header>
    <section aria-label="現在" style="background: #FFFFFF; border: 2px solid #F2C14E; border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center">
      <span style="display: flex; flex-direction: column; gap: 2px"><span class="num" style="font-size: 13px; color: #5B6578">13:00 – 14:00</span><span style="font-size: 18px; font-weight: 700">午餐　祇園割烹</span></span>
      <span style="font-size: 12px; font-weight: 700; background: #F2C14E; padding: 4px 10px; border-radius: 12px">現在</span>
    </section>
    <section aria-labelledby="later-h">
      <h2 id="later-h" style="margin: 0 0 4px; font-size: 13px; font-weight: 500; color: #5B6578">稍後</h2>
      <ul style="list-style: none; margin: 0; padding: 0">
        <sc-for list="{{later}}" as="it" hint-placeholder-count="3">
          <li style="{{it.rowStyle}}">
            <span class="num" style="width: 92px; font-size: 14px; color: #5B6578">{{it.time}}</span>
            <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{it.name}}</span><sc-if value="{{it.hasSub}}" hint-placeholder-val="{{false}}"><span style="{{it.subStyle}}">{{it.sub}}</span></sc-if></span>
            <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="{{it.badgeStyle}}">{{it.badge}}</span></sc-if>
            <sc-if value="{{it.canOpen}}" hint-placeholder-val="{{false}}"><button onClick="{{openSheet}}" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #E8B4AF; background: #FFFFFF; color: #B83A32; font: inherit; font-size: 13px; font-weight: 700">改用備案</button></sc-if>
          </li>
        </sc-for>
      </ul>
    </section>
  </main>

  <sc-if value="{{isApplied}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 40px; min-height: 56px; box-sizing: border-box; padding: 8px 8px 8px 16px; border-radius: 14px; background: #1E2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px">
      <span>已改用{{chosenName}}，行程已更新</span>
      <button onClick="{{undo}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #F2C14E; font: inherit; font-size: 14px; font-weight: 700">復原</button>
    </div>
  </sc-if>

  <sc-if value="{{isSheet}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(30,42,68,0.55)"></div>
    <section role="dialog" aria-modal="true" aria-labelledby="sheet-h" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 16px">
      <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DCE1E8"></span>
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div>
          <p class="num" style="margin: 0; font-size: 13px; color: #5B6578">15:00 – 15:30</p>
          <h2 id="sheet-h" style="margin: 2px 0 0; font-size: 22px; font-weight: 700">嵐山小火車不能去了？</h2>
        </div>
        <button onClick="{{closeSheet}}" aria-label="關閉" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F4F6F9; display: flex; align-items: center; justify-content: center; color: #1E2A44">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>

      <fieldset style="border: 0; margin: 0; padding: 0">
        <legend style="font-size: 13px; color: #5B6578; padding: 0; margin-bottom: 8px">原因</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
            <button aria-pressed="{{r.pressed}}" onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
          </sc-for>
        </div>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 13px; color: #5B6578; padding: 0; margin-bottom: 8px">選一個備案</legend>
        <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
          <label style="{{o.style}}">
            <input type="radio" name="alt" checked="{{o.checked}}" onChange="{{o.pick}}" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #1E2A44">
            <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 16px; font-weight: 700">{{o.name}}</span>
              <span class="num" style="font-size: 13px; color: #5B6578">{{o.time}}</span>
              <span style="{{o.impactStyle}}">{{o.impact}}</span>
            </span>
          </label>
        </sc-for>
      </fieldset>

      <button onClick="{{apply}}" style="height: 54px; border-radius: 14px; border: 0; background: #1E2A44; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700">改用{{chosenName}}</button>
      <button onClick="{{closeSheet}}" style="height: 44px; border: 0; background: transparent; color: #1E2A44; font: inherit; font-size: 15px">先不換，照原行程</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const stage = st.stage || 'sheet';
const reason = st.reason || '停駛';
const alt = st.alt || 'boat';
const opts = [
{ id: 'boat', name: '保津川遊船', time: '15:00 – 16:30', impact: '晚餐前的空檔會縮短 30 分鐘', warn: true },
{ id: 'walk', name: '嵐山竹林小徑散步', time: '15:00 – 16:00', impact: '不影響後面的行程', warn: false }
];
const chosen = opts.find((o) => o.id === alt);
const applied = stage === 'applied';
const chip = (on) => 'height: 40px; padding: 0 16px; border-radius: 20px; font: inherit; font-size: 14px; ' + (on ? 'border: 0; background: #1E2A44; color: #FFFFFF; font-weight: 700' : 'border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44');
const row = (hl) => 'display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 10px; margin: 0 -10px; border-bottom: 1px solid #DCE1E8; border-radius: 10px; ' + (hl ? 'background: #E4E8EE' : '');
const badge = (bg, fg) => 'font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; white-space: nowrap; background: ' + bg + '; color: ' + fg;
const train = applied
? { time: chosen.time, name: chosen.name, hasSub: true, sub: '原本：嵐山小火車（' + reason + '）', subStyle: 'font-size: 12px; color: #5B6578', hasBadge: true, badge: '已改用備案', badgeStyle: badge('#1E2A44', '#FFFFFF'), canOpen: false, rowStyle: row(true) }
: { time: '15:00 – 15:30', name: '嵐山小火車', hasSub: true, sub: '還沒訂', subStyle: 'font-size: 12px; font-weight: 700; color: #B83A32', hasBadge: false, canOpen: true, rowStyle: row(false) };
const tight = applied && chosen.warn;
const dinner = { time: '17:00 – 18:30', name: '錦市場晚餐', hasSub: tight, sub: '前一站結束後只剩 30 分鐘移動', subStyle: 'font-size: 12px; font-weight: 700; color: #B83A32', hasBadge: false, canOpen: false, rowStyle: row(false) };
const hotel = { time: '19:30', name: '回飯店', hasSub: false, hasBadge: false, canOpen: false, rowStyle: row(false) };
return {
later: [train, dinner, hotel],
isSheet: stage === 'sheet',
isApplied: applied,
chosenName: chosen.name,
openSheet: () => this.setState({ stage: 'sheet' }),
closeSheet: () => this.setState({ stage: 'idle' }),
apply: () => this.setState({ stage: 'applied' }),
undo: () => this.setState({ stage: 'idle' }),
reasons: ['客滿', '誤點', '停駛', '不想去了'].map((l) => ({ label: l, pressed: String(l === reason), style: chip(l === reason), pick: () => this.setState({ reason: l }) })),
options: opts.map((o) => ({
...o,
checked: o.id === alt,
pick: () => this.setState({ alt: o.id }),
style: 'display: flex; gap: 12px; padding: 14px; border-radius: 14px; cursor: pointer; ' + (o.id === alt ? 'border: 2px solid #1E2A44; background: #FFFFFF' : 'border: 1px solid #DCE1E8; background: #F4F6F9'),
impactStyle: 'font-size: 13px; font-weight: 700; color: ' + (o.warn ? '#B83A32' : '#1F7A5C')
}))
};
}
}
</script>
</body>
</html>
