<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>預訂與備案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A44}a:hover{color:#000000}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F6F9; color: #1E2A44; font-family: 'Noto Sans TC', system-ui, sans-serif; overflow: hidden; position: relative">
<main style="flex: 1; overflow: hidden; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">預訂</h1>
    <a href="BookingEdit.dc.html" aria-label="新增預訂" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1E2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
  </header>

  <div role="group" aria-label="篩選類別" style="display: flex; gap: 8px">
    <button aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: #1E2A44; color: #FFFFFF; font: inherit; font-size: 14px">全部</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44; font: inherit; font-size: 14px">交通</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44; font: inherit; font-size: 14px">住宿</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44; font: inherit; font-size: 14px">餐廳</button>
    <button aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCE1E8; background: #FFFFFF; color: #1E2A44; font: inherit; font-size: 14px">門票</button>
  </div>

  <article style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <div style="flex: 1">
      <p class="num" style="margin: 0; font-size: 12px; color: #5B6578">11/20 06:00 起飛</p>
      <h2 class="num" style="margin: 2px 0 0; font-size: 17px; font-weight: 700">去程 TPE → KIX</h2>
    </div>
  </article>

  <article style="position: relative; background: #FFFFFF; border-radius: 16px">
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div>
          <p class="num" style="margin: 0; font-size: 12px; color: #5B6578">11/20 15:00 入住，4 晚</p>
          <h2 style="margin: 2px 0 0; font-size: 17px; font-weight: 700">{{currentName}}</h2>
        </div>
        <sc-if value="{{switched}}" hint-placeholder-val="{{false}}">
          <span style="font-size: 12px; font-weight: 700; color: #FFFFFF; background: #1E2A44; padding: 4px 10px; border-radius: 12px">已改用備案</span>
        </sc-if>      </div>
      <p class="num" style="margin: 0; font-size: 13px; color: #5B6578">訂單編號 [訂單編號]</p>
    </div>
    <div aria-hidden="true" style="position: relative; height: 0; border-top: 2px dashed #DCE1E8; margin: 0 14px"></div>
    <span aria-hidden="true" style="position: absolute; left: -10px; top: 76px; width: 20px; height: 20px; border-radius: 10px; background: #F4F6F9"></span>
    <span aria-hidden="true" style="position: absolute; right: -10px; top: 76px; width: 20px; height: 20px; border-radius: 10px; background: #F4F6F9"></span>
    <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
      <h3 style="margin: 0; font-size: 13px; font-weight: 500; color: #5B6578">備案：主方案不行時，照順序改用</h3>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #F4F6F9">
        <span class="num" style="width: 26px; height: 26px; border-radius: 13px; background: #1E2A44; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{altName}}</span><span class="num" style="font-size: 12px; color: #5B6578">{{altSub}}</span></span>
        <button onClick="{{toggle}}" style="height: 40px; padding: 0 12px; border-radius: 10px; border: 0; background: #1E2A44; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">{{actionLabel}}</button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: #F4F6F9">
        <span class="num" style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; border: 1px solid #B8C0CC; box-sizing: border-box; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">河原町民宿</span><span style="font-size: 12px; color: #5B6578">還沒訂</span></span>
        <a href="#" style="height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #DCE1E8; background: #FFFFFF; font-size: 13px; font-weight: 500; text-decoration: none; display: flex; align-items: center">需先訂房</a>
      </div>
    </div>
  </article>

  <article style="background: #FFFFFF; border: 1.5px solid #E8B4AF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div>
        <p class="num" style="margin: 0; font-size: 12px; color: #5B6578">11/21 15:00</p>
        <h2 style="margin: 2px 0 0; font-size: 17px; font-weight: 700">嵐山小火車</h2>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #B83A32; background: #F9E1DF; padding: 4px 10px; border-radius: 12px">還沒訂</span>
    </div>
    <p style="margin: 0; font-size: 13px; color: #5B6578">已在 <span class="num">10/21 10:00</span> 開賣，還沒訂。備案：保津川遊船</p>
  </article>
</main>

<sc-if value="{{switched}}" hint-placeholder-val="{{false}}">
  <div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 100px; height: 52px; box-sizing: border-box; padding: 0 8px 0 16px; border-radius: 14px; background: #1E2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; font-size: 14px">
    <span>已改用 {{currentName}}</span>
    <button onClick="{{toggle}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; color: #F2C14E; font: inherit; font-size: 14px; font-weight: 700">復原</button>
  </div>
</sc-if>

<nav aria-label="主選單" style="height: 84px; box-sizing: border-box; padding: 6px 8px 24px; background: #FFFFFF; border-top: 1px solid #DCE1E8; display: flex">
  <a href="Today.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></span>今日
  </a>
  <a href="PlanList.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>行程
  </a>
  <a href="Bookings.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1E2A44; font-size: 11px; font-weight: 700">
    <span style="width: 52px; height: 30px; border-radius: 15px; background: #F2C14E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M15 7v10" stroke-dasharray="2 2"></path></svg></span>預訂
  </a>
  <a href="Essentials.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg></span>必備
  </a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = !!(this.state && this.state.switched);
return {
switched: s,
notSwitched: !s,
currentName: s ? 'Hotel B 烏丸' : '京都車站飯店',
altName: s ? '京都車站飯店' : 'Hotel B 烏丸',
altSub: s ? '原本的飯店，訂單還在，隨時能換回' : '訂單確認，11/18 前可免費取消',
actionLabel: s ? '換回京都車站飯店' : '改用 Hotel B 烏丸',
toggle: () => this.setState({ switched: !s })
};
}
}
</script>
</body>
</html>
