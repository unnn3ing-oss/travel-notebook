<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>出發前準備清單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E2A44}a:hover{color:#000000}
.num{font-family:'Space Grotesk',system-ui,sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F4F6F9; color: #1E2A44; font-family: 'Noto Sans TC', system-ui, sans-serif; overflow: hidden">
<main style="flex: 1; overflow: hidden; padding: 56px 20px 16px; display: flex; flex-direction: column; gap: 14px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">出發前準備</h1>
    <button aria-label="新增項目" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1E2A44; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>

  <div style="display: flex; align-items: center; gap: 12px">
    <div role="progressbar" aria-label="準備進度" aria-valuenow="{{doneCount}}" aria-valuemin="0" aria-valuemax="{{total}}" style="flex: 1; height: 8px; border-radius: 4px; background: #DCE1E8; overflow: hidden">
      <div style="{{barStyle}}"></div>
    </div>
    <span class="num" style="font-size: 14px; font-weight: 700">{{doneCount}} / {{total}}</span>
  </div>
  <p style="margin: -6px 0 0; font-size: 13px; color: #5B6578">截止日從出發日 11/20 往前算，改了出發日會自動更新。</p>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
    <section style="background: #FFFFFF; border-radius: 16px; padding: 10px 16px">
      <h2 style="margin: 4px 0; font-size: 14px; font-weight: 700; color: #5B6578">{{g.name}}</h2>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-height: 44px; padding: 8px 0; box-sizing: border-box; border-top: 1px solid #EEF1F5">
          <label style="{{it.labelStyle}}"><input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 20px; height: 20px; accent-color: #1F7A5C">{{it.title}}</label>
          <span style="margin-left: 30px; {{it.dueStyle}}">{{it.due}}</span>
        </div>
      </sc-for>
    </section>
  </sc-for>
</main>

<nav aria-label="主選單" style="height: 84px; box-sizing: border-box; padding: 6px 8px 24px; background: #FFFFFF; border-top: 1px solid #DCE1E8; display: flex">
  <a href="Main.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span>總覽
  </a>
  <a href="PlanList.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>行程
  </a>
  <a href="Bookings.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6578; font-size: 11px">
    <span style="width: 52px; height: 30px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"></path><path d="M15 7v10" stroke-dasharray="2 2"></path></svg></span>預訂
  </a>
  <a href="Essentials.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1E2A44; font-size: 11px; font-weight: 700">
    <span style="width: 52px; height: 30px; border-radius: 15px; background: #F2C14E; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"></path><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"></path></svg></span>必備
  </a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const base = [
{ name: '證件', items: [['passport', '護照效期確認', 0, true], ['vjw', '登錄 Visit Japan Web', 3, false]] },
{ name: '金錢', items: [['card', '信用卡開通海外刷卡', 7, true], ['yen', '換日圓現金', 5, false]] },
{ name: '通訊', items: [['esim', '買日本 eSIM', 2, false]] },
{ name: '行李', items: [['power', '行動電源放隨身行李', 0, false], ['adapter', '充電線與轉接頭', 0, true]] }
];
const st = (this.state && this.state.done) || {};
let doneCount = 0, total = 0;
const groups = base.map((g) => ({
name: g.name,
items: g.items.map(([id, title, days, d0]) => {
const done = id in st ? st[id] : d0;
total++; if (done) doneCount++;
const left = 15 - days;
const dd = new Date(2026, 10, 20 - days);
const urgent = !done && days > 0 && left <= 3;
return {
title, done,
due: done ? '完成' : (days > 0 ? '要在 ' + (dd.getMonth() + 1) + '/' + String(dd.getDate()).padStart(2, '0') + ' 前完成（還剩 ' + left + ' 天）' : '出發當天'),
labelStyle: 'display: flex; align-items: center; gap: 10px; font-size: 15px; ' + (done ? 'color: #5B6578; text-decoration: line-through' : 'color: #1E2A44'),
dueStyle: 'font-size: 13px; ' + (urgent ? 'font-weight: 700; color: #B83A32' : (done ? 'color: #1F7A5C; font-weight: 700' : 'color: #5B6578')),
toggle: () => this.setState({ done: { ...st, [id]: !done } })
};
})
}));
return { groups, doneCount, total, barStyle: 'height: 100%; background: #1F7A5C; width: ' + Math.round(doneCount / total * 100) + '%' };
}
}
</script>
</body>
</html>
